services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logistic-planner-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_PATH=/app/data/logistic.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
    name: logistic_planner_backend_data
